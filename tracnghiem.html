        let currentQuizQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        function startQuiz() {
            const topic = document.getElementById('topic-select').value;
            const countSelect = document.getElementById('count-select').value;

            let filtered = topic === 'all' 
                ? [...questionBank] 
                : questionBank.filter(q => q.topic === topic);

            // Shuffle pool
            filtered.sort(() => Math.random() - 0.5);
            
            let count = countSelect === '150' ? filtered.length : parseInt(countSelect);
            currentQuizQuestions = filtered.slice(0, Math.min(count, filtered.length));

            if (currentQuizQuestions.length === 0) {
                alert("Không đủ câu hỏi cho chủ đề này!");
                return;
            }

            currentIndex = 0;
            score = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('explanation-container').classList.add('hidden');

            const q = currentQuizQuestions[currentIndex];
            document.getElementById('question-tracker').innerText = `Câu ${currentIndex + 1} / ${currentQuizQuestions.length}`;
            document.getElementById('score-tracker').innerText = `Đúng: ${score}`;
            document.getElementById('question-container').innerHTML = `<h3 class="text-lg font-semibold text-slate-800">${q.question}</h3>`;

            // Randomize options
            let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
            optionsWithIndex.sort(() => Math.random() - 0.5);

            let optionsHtml = '';
            optionsWithIndex.forEach((item) => {
                optionsHtml += `
                    <button onclick="selectAnswer(${item.originalIdx}, ${q.correct}, this)" 
                        class="option-btn w-full text-left p-4 rounded-lg border border-slate-200 hover:bg-slate-50 hover:border-indigo-300 transition duration-150 font-medium text-slate-700">
                        ${item.text}
                    </button>
                `;
            });
            document.getElementById('options-container').innerHTML = optionsHtml;
        }

        function selectAnswer(selectedIdx, correctIdx, btnElement) {
            if (answered) return;
            answered = true;

            const q = currentQuizQuestions[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');

            buttons.forEach(btn => {
                btn.disabled = true;
                const text = btn.innerText.trim();
                const originalIndex = q.options.findIndex(opt => opt.trim() === text);
                if (originalIndex === correctIdx) {
                    btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
                }
            });

            if (selectedIdx === correctIdx) {
                score++;
                document.getElementById('score-tracker').innerText = `Đúng: ${score}`;
            } else {
                btnElement.classList.remove('border-slate-200', 'hover:bg-slate-50');
                btnElement.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-700');
            }

            const expContainer = document.getElementById('explanation-container');
            expContainer.innerHTML = `<p class="font-semibold text-slate-700 mb-1">Giải thích:</p><p class="text-slate-600">${q.rationale}</p>`;
            expContainer.classList.remove('hidden');

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuizQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score-text').innerText = `Bạn đã trả lời đúng ${score}/${currentQuizQuestions.length} câu hỏi.`;
        }

        function restartQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
